services:
  haproxy:
    build:
      context: ./images/haproxy
      dockerfile: ./Dockerfile
    volumes:
      - ./images/haproxy/haproxy_dev.cfg:/usr/local/etc/haproxy/haproxy.cfg
    ports:
      - 8082:80
    restart: always
    depends_on:
      - api
      - app
      - ws
      - ws2
  api:
    build:
      context: ./images/api
      dockerfile: ./Dockerfile
    command: bash -c "composer i && php /code/public/index.php start"
    # tty: true
    working_dir: /code
    volumes:
      - ./../../../code/api:/code
    depends_on:
      - redis
      - db

  ws2:
    build:
      context: ./images/api
      dockerfile: ./Dockerfile
    command: bash -c "composer i && php /code/public/wsInfo.php start"
    working_dir: /code
    volumes:
      - ./../../../code/api:/code
    depends_on:
      - redis
      - db

  ws:
    build:
      context: ./images/api
      dockerfile: ./Dockerfile
    command: bash -c "composer i && php /code/public/websocket.php start"
    # tty: true
    working_dir: /code
    volumes:
      - ./../../../code/api:/code
    depends_on:
      - redis
      - db

  app:
    build:
      context: ./images/app
      dockerfile: ./Dockerfile
    restart: always
    working_dir: /code
    volumes:
      - ./../../../code/app:/code
      - ./images/app/default.conf:/etc/nginx/conf.d/default.conf
  redis:
    image: redis:latest
    restart: always
  db:
    image: mariadb:latest
    restart: always
    environment:
      - MYSQL_DATABASE=db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
      - MYSQL_ROOT_PASSWORD=pass
    volumes:
      - db-blog-test-data:/var/lib/mysql
volumes:
  db-blog-test-data: